# XcodeGen spec — generates AiNotetaker.xcodeproj.
#   cd ios && ./generate.sh && open AiNotetaker.xcodeproj
# generate.sh keeps your signing team across regenerations (Config/Local.xcconfig).
name: AiNotetaker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Config/Local.xcconfig is git-ignored and holds your DEVELOPMENT_TEAM. XcodeGen
# rewrites the whole .xcodeproj on every `generate`, so a team picked in Xcode's
# Signing & Capabilities UI does NOT survive a regenerate — but a value coming
# from this referenced xcconfig file does, since the file itself is untouched.
# ./generate.sh creates it from Config/Local.xcconfig.example on first run.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AiNotetaker:
    type: application
    platform: iOS
    sources:
      - path: AiNotetaker
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ainotetaker
        PRODUCT_NAME: AiNotetaker
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: AiNotetaker/Info.plist
      properties:
        CFBundleDisplayName: AiNotetaker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "AiNotetaker records your voice notes so they can be transcribed."
        NSLocalNetworkUsageDescription: "AiNotetaker connects to your private Mac server to upload recordings and retrieve transcripts."
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
