<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
  />
  <title>Notes</title>

  <!-- PWA / iOS home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notes" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ───────────────── Login ───────────────── -->
  <section id="login-view" class="view" hidden>
    <div class="login-card">
      <div class="login-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="44" height="44"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V7h3.5L14 3.5ZM8 12h8v1.5H8V12Zm0 3.5h8V17H8v-1.5ZM8 8.5h4V10H8V8.5Z"/></svg>
      </div>
      <h1 id="login-title">Notes</h1>
      <p class="login-sub">This space is private. Enter your password to continue.</p>
      <form id="login-form" autocomplete="off">
        <input
          id="login-password"
          type="password"
          inputmode="text"
          placeholder="Password"
          autocomplete="current-password"
          aria-label="Password"
        />
        <button type="submit" id="login-button">Unlock</button>
        <p id="login-error" class="login-error" hidden></p>
      </form>
    </div>
  </section>

  <!-- ───────────────── Notes list ───────────────── -->
  <section id="list-view" class="view" hidden>
    <header class="list-header safe-top">
      <div class="list-header-row">
        <span class="header-accent">Personal</span>
        <button id="logout-button" class="text-button" type="button" hidden>Lock</button>
      </div>
      <h1 class="large-title">Notes</h1>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 4a6 6 0 1 1-4.2 10.3l-3.3 3.3-1.4-1.4 3.3-3.3A6 6 0 0 1 10 4Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        <input id="search-input" type="search" placeholder="Search" aria-label="Search notes" />
      </div>
    </header>

    <div id="notes-list" class="notes-list" role="list"></div>

    <div id="empty-state" class="empty-state" hidden>
      <svg viewBox="0 0 24 24" width="52" height="52" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1.5V7h3.5L14 3.5Z"/></svg>
      <p>No Notes</p>
      <span>Tap the compose button to write your first note, or use the microphone to speak it.</span>
    </div>

    <footer class="list-toolbar safe-bottom">
      <span id="notes-count" class="notes-count"></span>
      <button id="compose-button" class="compose-button" type="button" aria-label="New note">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M4 20h4l10.5-10.5-4-4L4 16v4Zm2-3.2 8.8-8.8 1.2 1.2L7.2 18H6v-1.2ZM17.7 4.3l2 2c.4.4.4 1 0 1.4l-1.3 1.3-4-4L15.7 3.7c.4-.4 1-.4 1.4 0l.6.6Z"/></svg>
      </button>
    </footer>
  </section>

  <!-- ───────────────── Editor ───────────────── -->
  <section id="editor-view" class="view" hidden>
    <header class="editor-nav safe-top">
      <button id="back-button" class="text-button back" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15 4.5 7.5 12 15 19.5l-1.4 1.4L4.7 12l8.9-8.9L15 4.5Z"/></svg>
        <span>Notes</span>
      </button>
      <div class="editor-nav-actions">
        <button id="pin-button" class="icon-button" type="button" aria-label="Pin note" title="Pin">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 2l8 8-1.4 1.4-1-1-4 4 .5 4.6L14 20.6l-3.8-3.8-4.8 4.8L4 20.2l4.8-4.8L5 11.6l1.6-1.6 4.6.5 4-4-1-1L15.6 4 14 2Z"/></svg>
        </button>
        <button id="delete-button" class="icon-button" type="button" aria-label="Delete note" title="Delete">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2ZM6 9h12l-1 12H7L6 9Zm3 2 .4 8h1.2L10 11H9Zm4 0-.4 8h1.2l.4-8H13Z"/></svg>
        </button>
      </div>
    </header>

    <div class="editor-scroll">
      <div class="editor-date" id="editor-date"></div>
      <input
        id="note-title"
        class="note-title"
        type="text"
        dir="auto"
        placeholder="Title"
        aria-label="Note title"
      />
      <textarea
        id="note-body"
        class="note-body"
        dir="auto"
        placeholder="Start typing, or tap the microphone to dictate…"
        aria-label="Note body"
      ></textarea>
    </div>

    <!-- Recording status pill -->
    <div id="rec-status" class="rec-status" hidden>
      <span id="rec-dot" class="rec-dot"></span>
      <span id="rec-text">Recording…</span>
      <span id="rec-timer" class="rec-timer">0:00</span>
    </div>

    <!-- Microphone button -->
    <button id="mic-button" class="mic-button safe-bottom-fab" type="button" aria-label="Record voice">
      <svg class="mic-icon" viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v5.5A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-5 5.92V21h-2v-3.58a6 6 0 0 1-5-5.92H8a4 4 0 0 0 8 0h2Z"/></svg>
      <span class="stop-icon" aria-hidden="true"></span>
    </button>
  </section>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
