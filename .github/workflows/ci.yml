name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate setup scripts
        run: bash -n scripts/setup-remote-access.sh
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q tests

  ios:
    name: iOS app compiles (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && ./generate.sh
      - name: Build (unsigned, simulator)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project AiNotetaker.xcodeproj -scheme AiNotetaker -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 120
